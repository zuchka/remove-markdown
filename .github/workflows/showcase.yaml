name: Showcase

on:
  push:
    branches: [main]
    paths: ['showcase/**', 'fixtures/**', 'scripts/*site.mjs', 'test/showcase.test.mjs', 'bench/statistics.mjs', 'bench/results/**', 'bench/README.md', 'index*', 'package*.json', 'wrangler.jsonc', '.github/workflows/showcase.yaml']
  pull_request:
    paths: ['showcase/**', 'fixtures/**', 'scripts/*site.mjs', 'test/showcase.test.mjs', 'bench/statistics.mjs', 'bench/results/**', 'bench/README.md', 'index*', 'package*.json', 'wrangler.jsonc', '.github/workflows/showcase.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run test:showcase
      - run: npm run check:esm
      - run: npm run deploy:site -- --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: showcase-preview
          path: dist/site/
          if-no-files-found: error
